name: Deploy backend to VPS

# The backend now deploys to Vercel, which builds from GitHub directly and
# needs no workflow of its own. This VPS path is kept for rollback but is
# manual-only: leaving it on `push` would fail on every commit once the VPS
# is gone. Run it from the Actions tab if you need the VPS back.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/chainscope
            git fetch origin main
            git reset --hard origin/main
            docker compose -f deploy/docker-compose.yml up -d --build
