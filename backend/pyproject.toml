[project]
name = "chainscope-backend"
version = "0.1.0"
description = "FastAPI + LangGraph backend for ChainScope"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.30",
    "langchain-openai>=0.2.14",
    "langchain-mcp-adapters>=0.0.5",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "plotly>=5.24",
]

[tool.uv]
package = false
