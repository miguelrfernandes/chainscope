[project]
name = "chainscope-backend"
version = "0.1.0"
description = "FastAPI + LangGraph backend for ChainScope"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.30",
    "langchain-openai>=0.2.14",
    "langchain-mcp-adapters>=0.0.5",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "hedera-agent-kit>=3.4.2",
    "apscheduler>=3.11.3",
    "sqlalchemy>=2.0.51",
    "psycopg[binary]>=3.2",
]

[tool.uv]
package = false
# hedera-agent-kit pulls in google-adk, which drags along pyarrow,
# google-api-python-client and google-cloud-* — 411MB of transitive deps for
# code we never import (we only use hedera_agent_kit.langchain / .plugins /
# .shared). That blows past Vercel's serverless bundle limit, so the dep is
# overridden out with a marker that is never satisfiable. If a future
# hedera-agent-kit release imports google-adk at module scope, this will
# surface as an ImportError in app/tools/hedera_actions.py — drop the
# override and find another way to slim the bundle if that happens.
override-dependencies = ["google-adk ; python_version < '3.0'"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]
evals = [
    "langsmith>=0.10.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: marks test as a live integration test",
]
filterwarnings = [
    "ignore:.*websockets.legacy.*:DeprecationWarning",
    "ignore::langgraph.warnings.LangGraphDeprecatedSinceV10",
]


[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]


