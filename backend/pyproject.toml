[project]
name = "chainscope-backend"
version = "0.1.0"
description = "FastAPI + LangGraph backend for ChainScope"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.30",
    "langchain-openai>=0.2.14",
    "langchain-mcp-adapters>=0.0.5",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "hedera-agent-kit>=3.4.2",
    "apscheduler>=3.11.3",
    "sqlalchemy>=2.0.51",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]
evals = [
    "langsmith>=0.10.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: marks test as a live integration test",
]
filterwarnings = [
    "ignore:.*websockets.legacy.*:DeprecationWarning",
    "ignore::langgraph.warnings.LangGraphDeprecatedSinceV10",
]


[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]


